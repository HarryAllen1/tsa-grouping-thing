name: Deploy to Firebase
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Functions dependencies
        run: cd functions && pnpm install && cd ..

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            pnpm dlx firebase-tools deploy --project tsa-grouping-thing --token "${{ secrets.FIREBASE_TOKEN }}" && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Deploy attempt ${attempt} failed; retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "Deploy failed after 3 attempts."
          exit 1
